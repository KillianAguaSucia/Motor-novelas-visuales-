[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py38"
extend-exclude = ["saves"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "UP006", "UP007", "UP035", "UP037", "UP045",   # el proyecto mantiene typing.List/Optional (Python 3.8+)
    "E501",                                 # largo de línea: lo controla el formateo, no el linter
]

[tool.ruff.lint.isort]
known-first-party = ["audio_manager", "engine", "errors", "input_map", "save_manager", "scene", "state", "states", "ui"]

[tool.mypy]
files = ["."]
exclude = ["tests/", "tools/", "saves/"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
